# docker-compose.yml

services:
  mongodb:
    image: mongo:6-jammy
    container_name: flipcard-mongo
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-quizflip}
      MONGO_DB: ${MONGO_DB:-quizflip}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-quizflip_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-quizflip_app_password}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u $$MONGO_APP_USERNAME -p $$MONGO_APP_PASSWORD --authenticationDatabase $$MONGO_DB --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: flipcard-server
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5000}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-env}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
    ports:
      - "${SERVER_PORT:-5000}:5000"
    volumes:
      - ./server:/app
      - ./.env:/app/.env:ro
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_started
    command: npm run dev

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: flipcard-client
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      VITE_REACT_APP_API_BASE_URL: ${VITE_REACT_APP_API_BASE_URL:-http://localhost:5000/api}
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    command: npm run dev:docker

volumes:
  mongo_data:
