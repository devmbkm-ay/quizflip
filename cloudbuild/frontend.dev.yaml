substitutions:
  _API_BASE_URL: "REPLACE_WITH_DEV_API_URL/api"
  _BUCKET_NAME: "REPLACE_WITH_DEV_BUCKET"

steps:
  - name: node:20
    entrypoint: bash
    args:
      - -lc
      - |
        cd client
        npm ci
        VITE_REACT_APP_API_BASE_URL=${_API_BASE_URL} npm run build

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -lc
      - |
        gcloud storage rsync --recursive --delete-unmatched-destination-objects client/dist gs://${_BUCKET_NAME}

timeout: 1800s
